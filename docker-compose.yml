version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-8.0.44
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    networks:
      - note-network
networks:
  note-network:
    driver: bridge